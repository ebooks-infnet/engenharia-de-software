              "De forma simples, **software** é o conjunto de instruções que orienta um equipamento a executar tarefas específicas. Sem ele, o hardware — isto é, a parte física do dispositivo — não conseguiria realizar nenhuma função.",
              "Se você tem curiosidade sobre como essas soluções são desenvolvidas, conhecer a área de engenharia software é um excelente ponto de partida para entender os processos por trás da criação de programas e sistemas.",
              "## **O que significa software?**",
              "Quando alguém pesquisa “**o que é software**” ou “**o que significa software**”, normalmente busca entender a diferença entre a parte física e a lógica de um dispositivo.",
              "O **significado de software** está relacionado à parte intangível da tecnologia: programas, códigos, dados e instruções que fazem um equipamento funcionar. Enquanto o hardware reúne componentes como processador, memória, teclado e monitor, o software é responsável por dizer ao dispositivo exatamente o que fazer.",
              "Em outras palavras, **o que é um software**? É um programa desenvolvido para executar uma ou mais funções, como editar documentos, navegar na internet, reproduzir vídeos, controlar equipamentos industriais ou gerenciar processos empresariais.",
              "Essa combinação entre hardware e software está presente em praticamente toda a tecnologia que utilizamos atualmente.",
              "## **Como funciona a estrutura de um software?**",
              "Embora existam programas simples e outros extremamente complexos, a maioria dos softwares é composta por alguns elementos fundamentais.",
              "### **Código-fonte**",
              "O código-fonte é o conjunto de instruções escritas por desenvolvedores em linguagens de programação, como Java, Python, C# ou JavaScript. Esse código define toda a lógica do programa e determina como ele responderá às ações do usuário.",
              "### **Interface com o usuário**",
              "A interface reúne os elementos visuais com os quais as pessoas interagem, como botões, menus, formulários, ícones e telas. Uma interface intuitiva torna o uso do software mais simples e eficiente.",
              "### **Dados**",
              "Os dados armazenam as informações utilizadas pelo programa. Um aplicativo bancário, por exemplo, precisa registrar saldos, transações, usuários e históricos de movimentação para funcionar corretamente.",
              "### **Integrações**",
              "Grande parte dos softwares modernos também se conecta a outros serviços, como sistemas de pagamento, mapas, armazenamento em nuvem, autenticação de usuários e ferramentas de comunicação. Essas integrações ampliam as funcionalidades da aplicação e tornam a experiência mais completa.",
              "## **Software é a mesma coisa que sistema?**",
              "Não. Embora os termos sejam frequentemente utilizados como sinônimos, eles possuem significados diferentes.",
              "Um **software** normalmente representa um programa ou aplicação específica, criada para executar determinada função.",
              "Já um sistema é formado por diferentes componentes que trabalham de maneira integrada para atender a um objetivo mais amplo.",
              "Imagine uma loja virtual. Ela pode utilizar um software para controlar o estoque, outro para processar pagamentos, outro para emitir notas fiscais e outro para atender clientes. Quando todas essas soluções funcionam de forma integrada, elas compõem um sistema.",
              "Essa diferença ajuda a entender que todo sistema utiliza softwares, mas nem todo software corresponde a um sistema completo.",
              "## **O que é software? Exemplos do dia a dia**",
              "Quem procura por **exemplos do que é software** geralmente quer relacionar o conceito com ferramentas conhecidas.",
              "Alguns exemplos bastante comuns são:",
              "• aplicativos de mensagens;",
              "• navegadores de internet;",
              "• editores de texto;",
              "• planilhas eletrônicas;",
              "• sistemas operacionais;",
              "• plataformas de streaming;",
              "• aplicativos bancários;",
              "• softwares de edição de imagens e vídeos;",
              "• ferramentas de videoconferência;",
              "• jogos digitais.",
              "Além dessas soluções voltadas ao consumidor, existem softwares utilizados por empresas para gestão financeira, atendimento ao cliente, controle de estoque, análise de dados, automação de processos e gerenciamento de projetos.",
              "Essas aplicações estão presentes em organizações de todos os segmentos e fazem parte da transformação digital vivida por empresas e profissionais.",
              "## **A importância do software para as Engenharias Tech**",
              "À medida que as soluções digitais se tornam mais sofisticadas, cresce também a demanda por profissionais capazes de projetar, desenvolver e evoluir softwares robustos, seguros e escaláveis.",
              "Nesse contexto, as **Engenharias Tech** reúnem áreas responsáveis por construir a infraestrutura tecnológica que sustenta aplicações, plataformas digitais e sistemas utilizados por empresas de diferentes setores. Entre elas, a engenharia de software desempenha um papel essencial no desenvolvimento de soluções capazes de atender às necessidades de pessoas e organizações.",
              "## **Conclusão**",
              "Agora que você já sabe **o que é software**, fica mais fácil compreender por que ele está presente em praticamente todas as atividades digitais do cotidiano.",
              "Seja em aplicativos, plataformas online ou sistemas corporativos, o software transforma instruções em funcionalidades que facilitam a comunicação, a produtividade e a inovação.",
              "Se você deseja entender como essas soluções são planejadas, desenvolvidas e mantidas, vale a pena conhecer melhor a área de engenharia software. Ela reúne conhecimentos fundamentais para quem pretende construir tecnologias que impactam milhões de pessoas e empresas."

          {

              "Durante a graduação, também é comum desenvolver projetos práticos que simulam desafios reais do mercado, permitindo aplicar os conhecimentos adquiridos em sala de aula.",
              "## **Graduação em Engenharia de Software**",
              "A graduação costuma ter duração média de **quatro anos**, podendo variar conforme a instituição e o formato do curso.",
              "Nos primeiros períodos, o foco está nos fundamentos da computação, matemática aplicada, algoritmos e programação. À medida que o aluno avança, passa a estudar temas mais específicos, como arquitetura de software, bancos de dados, testes automatizados, desenvolvimento de aplicações e integração entre sistemas.",
              "Outro diferencial da formação é o contato com metodologias ágeis, utilizadas para organizar projetos em ciclos curtos, com entregas frequentes e melhoria contínua.",
              "Quem busca se tornar **desenvolvedor de software através de uma faculdade** normalmente deseja aprender a criar aplicativos e sistemas. A graduação em engenharia de software oferece essa preparação, mas vai além da programação, formando profissionais capazes de participar de todas as etapas do desenvolvimento de um software.",
              "## **Pós-graduação em engenharia de software**",
              "A pós-graduação é indicada para profissionais que já possuem ensino superior e desejam aprofundar conhecimentos ou se especializar em áreas específicas.",
              "Dependendo do curso, é possível estudar temas como arquitetura de software, inteligência artificial, engenharia de dados, computação em nuvem, DevOps, segurança da informação e liderança de equipes técnicas.",
              "Nessa etapa, o foco costuma ser mais estratégico. Além do aprofundamento técnico, o estudante desenvolve competências relacionadas à tomada de decisão, definição de arquiteturas, modernização de sistemas e gestão de projetos de maior complexidade.",
              "## **Faculdade de Engenharia de Programação é a mesma coisa?**",

            title: "5. Engenheiro de software tem CREA? Entenda como funciona o registro profissional",

              "Uma dúvida comum entre estudantes e profissionais da área é: **engenheiro de software tem CREA**? A resposta é **sim**, desde que o profissional tenha uma formação compatível e atenda às exigências do Sistema Confea/Crea para obter o registro.",
              "A engenharia software passou a integrar oficialmente a Tabela de Títulos Profissionais do Conselho Federal de Engenharia e Agronomia (Confea) por meio da **Resolução Confea nº 1.100, de 24 de maio de 2018**, que definiu atribuições e competências para a profissão dentro do sistema de fiscalização.",
              "## **Engenheiro de software tem CREA?**",
              "Sim. **Engenheiro de software tem CREA** quando realiza o registro no Conselho Regional de Engenharia e Agronomia (Crea) do estado onde pretende exercer atividades regulamentadas.",
              "É importante destacar que o CREA não reconhece ou autoriza cursos superiores. Essa atribuição pertence ao Ministério da Educação (MEC). O papel do Sistema Confea/Crea é regulamentar e fiscalizar o exercício profissional das engenharias, agronomia e geociências.",
              "No caso da **engenharia de software**, a Resolução nº 1.100/2018 oficializou o título profissional de Engenheiro de Software e estabeleceu suas competências técnicas dentro do sistema.",
              "Quem pesquisa por “**engenharia de software crea-sp**”, por exemplo, encontrará no Crea-SP as orientações sobre registro profissional, documentação necessária e procedimentos para profissionais formados nessa área.",
              "## **Por que a Engenharia de Software foi regulamentada?**",
              "A regulamentação ocorreu para reconhecer oficialmente uma profissão que já desempenhava papel estratégico em diversos setores da economia.",
              "Hoje, softwares fazem parte da operação de bancos, hospitais, indústrias, sistemas de transporte, telecomunicações, energia, comércio eletrônico e serviços públicos. Em muitos desses ambientes, uma falha pode causar prejuízos financeiros, indisponibilidade de serviços ou comprometer informações sensíveis.",
              "Ao regulamentar a profissão, o Sistema Confea/Crea passou a estabelecer responsabilidades técnicas para atividades específicas de engenharia, contribuindo para aumentar a segurança, a qualidade e a confiabilidade dos projetos.",
              "Essa regulamentação também acompanha a crescente importância das **Engenharias Tech**, responsáveis pelo desenvolvimento de sistemas complexos que sustentam a infraestrutura digital utilizada por empresas e organizações.",
              "## **O que muda para o engenheiro de software?**",
              "Na prática, possuir o registro no CREA permite ao profissional exercer atividades técnicas enquadradas pelo Sistema Confea/Crea e assumir responsabilidades formais quando exigidas pela legislação ou pelo contratante.",
              "Entre essas atribuições está a emissão da **ART (Anotação de Responsabilidade Técnica)**, documento que identifica o responsável técnico por determinado serviço ou projeto de engenharia.",
              "Isso não significa, porém, que toda pessoa que desenvolve software precise obrigatoriamente possuir registro profissional.",
              "A obrigatoriedade depende das atividades exercidas. Um programador que atua exclusivamente no desenvolvimento de aplicações pode não precisar do registro, enquanto profissionais responsáveis por projetos de engenharia, emissão de documentos técnicos, laudos, perícias ou atividades regulamentadas podem necessitar dessa habilitação.",
              "Por isso, quando surge a dúvida se o **crea é obrigatório para engenheiro de software**, a resposta depende das responsabilidades técnicas assumidas e das exigências aplicáveis ao exercício da função.",

        // --- SISTEMA DE FORMATAÇÃO E PARSE DE TEXTO ---
        function highlightText(text, search) {
            if (!text || !search || !search.trim()) return text;
            const escapedSearch = search.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedSearch})`, 'gi');
            return text.replace(regex, `<mark class="bg-yellow-200 text-black px-0.5 rounded font-semibold">$1</mark>`);
        }

        function renderFormattedText(text, search, isTitle = false) {
            if (!text) return '';
            const boldParts = text.split('**');
            let resultHTML = '';
            
            boldParts.forEach((part, index) => {
                const isBold = index % 2 === 1;
                const content = highlightText(part, search);
                if (isBold) {
                    const boldClass = isTitle ? "font-extrabold text-[#689ccb]" : "font-extrabold text-inherit";
                    resultHTML += `<strong class="${boldClass}">${content}</strong>`;
                } else {
                    resultHTML += `<span>${content}</span>`;
                }
            });
            return resultHTML;
        }

        function renderParagraphHTML(paragraph) {
            // TÍTULOS SECUNDÁRIOS DE SEÇÃO (##) -> Destaque em caixa com fundo azul suave e borda lateral azul
            if (paragraph.startsWith('## ')) {
                return `<h3 class="text-xl md:text-2xl font-black mt-8 mb-4 p-3 rounded-xl bg-sky-50/90 dark:bg-sky-950/40 text-sky-700 dark:text-sky-300 border-l-4 border-sky-500 shadow-sm flex items-center tracking-tight">
                    ${renderFormattedText(paragraph.replace('## ', ''), state.searchQuery, true)}
                </h3>`;
            }
            // SUBTÍTULOS INTERNOS (###) -> Texto limpo em tom azul médio
            if (paragraph.startsWith('### ')) {
                return `<h4 class="text-lg md:text-xl font-bold mt-6 mb-3 text-[#23599c] dark:text-[#508ad3]">
                    ${renderFormattedText(paragraph.replace('### ', ''), state.searchQuery, true)}
                </h4>`;
            }
            // LISTAS NORMALIZADAS (- ou •)
            if (paragraph.startsWith('- ') || paragraph.startsWith('• ') || paragraph.startsWith('•\n')) {
                return `<li class="ml-5 list-disc mb-2 pl-2 leading-relaxed">
                    ${renderFormattedText(paragraph.replace(/^[-•]\s*/, ''), state.searchQuery, false)}
                </li>`;
            }
            // LISTAS NUMERADAS
            if (/^\d+\.\s/.test(paragraph)) {
                return `<p class="ml-2 mb-3 leading-relaxed font-semibold text-slate-800 dark:text-slate-200">
                    ${renderFormattedText(paragraph, state.searchQuery, false)}
                </p>`;
            }

            // TRATAMENTO DE QUEBRAS DE LINHA INTERNAS
            if (paragraph.includes('\n')) {
                const lines = paragraph.split('\n');
                let compositeHTML = '<div class="my-4 space-y-2">';
                lines.forEach(line => {
                    if (line.startsWith('- ') || line.startsWith('• ')) {
                        compositeHTML += `<li class="ml-5 list-disc pl-2 leading-relaxed">${renderFormattedText(line.replace(/^[-•]\s*/, ''), state.searchQuery, false)}</li>`;
                    } else if (line.includes(':') && line.length < 120) {
                        const parts = line.split(':');
                        const boldPart = parts[0];
                        const normalPart = parts.slice(1).join(':');
                        compositeHTML += `<p class="mb-1 leading-relaxed"><strong class="text-[#23599c] dark:text-[#508ad3]">${renderFormattedText(boldPart, state.searchQuery, false)}:</strong>${renderFormattedText(normalPart, state.searchQuery, false)}</p>`;
                    } else {
                        compositeHTML += `<p class="leading-relaxed">${renderFormattedText(line, state.searchQuery, false)}</p>`;
                    }
                });
                compositeHTML += '</div>';
                return compositeHTML;
            }

            return `<p class="mb-4 text-justify leading-relaxed">${renderFormattedText(paragraph, state.searchQuery, false)}</p>`;
        }

                    ${paragraphsHTML}
                </div>

                <!-- Barra de Navegação de Rodapé de Leitura -->
                <div class="p-4 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-current opacity-50 text-xs font-bold">
                    <button onclick="setChapter(${state.currentChapterIndex - 1})" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all flex items-center justify-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                        <span>Anterior</span>
                    </button>

                    <button onclick="setChapter(-1)" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all">
                        Ir para a Capa
                    </button>

                    ${state.currentChapterIndex < ebookData.length - 1 ? `
                        <button onclick="setChapter(${state.currentChapterIndex + 1})" class="w-full sm:w-auto px-4 py-2 border rounded-lg hover:bg-black/5 dark:hover:bg-white/5 text-center transition-all flex items-center justify-center space-x-2">
                            <span>Próximo</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    ` : `
                        <button onclick="setChapter(-1)" class="w-full sm:w-auto px-4 py-2 bg-[#23599c] text-white rounded-lg text-center transition-all">
                            Voltar ao Início
                        </button>
                    `}
                </div>
            </article>
            `;

            container.innerHTML = articleHTML;
        }

        // --- RENDERIZAÇÃO DOS DROPDOWNS SUPERIORES ---
        function renderBookmarksPanel() {
            const container = document.getElementById('bookmarks-panel-content');
            if (!container) return;

            let tabHTML = '';
            if (state.bookmarks.length === 0) {
                tabHTML += `
                <p class="text-xs text-center opacity-60 py-8">
                    Nenhum capítulo favoritado ainda. Toque na fita de favoritos enquanto lê para salvar aqui!
                </p>
                `;
            } else {
                state.bookmarks.forEach(bId => {
                    const chapterIndex = ebookData.findIndex(c => c.id === bId);
                    const chapter = ebookData[chapterIndex];
                    if (chapter) {
                        tabHTML += `
                        <button onclick="setChapter(${chapterIndex}); toggleTabPanel('bookmarks');" class="w-full text-left p-3 rounded-lg border border-current opacity-80 hover:opacity-100 hover:bg-black/5 dark:hover:bg-white/5 text-xs flex justify-between items-center transition-all">
                            <div class="truncate pr-2">
                                <div class="font-semibold">${chapter.title}</div>
                                <div class="text-[10px] opacity-60">${chapter.pageRange}</div>
                            </div>
                            <svg class="w-4 h-4 text-[#23599c] dark:text-[#508ad3] flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z" />
                            </svg>
                        </button>
                        `;
                    }
                });
            }

            container.innerHTML = tabHTML;
        }

        function renderSearchPanel() {
            const resultsContent = document.getElementById('search-results-content');
            const GrandpaResultsInfo = document.getElementById('search-results-info');
            if (!resultsContent || !GrandpaResultsInfo) return;

            const GrandpaResults = [];
            if (state.searchQuery.trim()) {
                ebookData.forEach(chapter => {
                    chapter.content.forEach((paragraph, pIdx) => {
                        if (paragraph.toLowerCase().includes(state.searchQuery.toLowerCase())) {
                            GrandpaResults.push({
                                chapterId: chapter.id,
                                chapterTitle: chapter.title,
                                paragraph: paragraph,
                                index: pIdx
                            });
                        }
                    });
                });
            }

            // Mostra informações do resultado de pesquisa
            if (state.searchQuery) {
                GrandpaResultsInfo.classList.remove('hidden');
                GrandpaResultsInfo.innerText = `${GrandpaResults.length} trechos encontrados`;
            } else {
                GrandpaResultsInfo.classList.add('hidden');
            }

            let resultsHTML = '';
            GrandpaResults.forEach(res => {
                const matchedChapterIdx = ebookData.findIndex(c => c.id === res.chapterId);
                resultsHTML += `
                <button onclick="setChapter(${matchedChapterIdx}); toggleTabPanel('search');" class="w-full text-left p-2.5 rounded-lg border border-[#23599c]/20 hover:bg-[#23599c]/5 text-xs space-y-1 block transition-all">
                    <div class="font-bold text-[#23599c] dark:text-[#508ad3] truncate">${res.chapterTitle}</div>
                    <p class="line-clamp-3 opacity-80 italic">"...${highlightText(res.paragraph, state.searchQuery)}..."</p>
                </button>
                `;
            });

            if (state.searchQuery && GrandpaResults.length === 0) {
                resultsHTML += `<p class="text-xs text-center opacity-60 py-4">Nenhum resultado para "${state.searchQuery}".</p>`;
            } else if (!state.searchQuery) {
                resultsHTML += `<p class="text-xs text-center opacity-60 py-4">Digite termos acima para pesquisar em todo o e-book...</p>`;
            }

            resultsContent.innerHTML = resultsHTML;
        }

        function handleSearch(val) {
            state.searchQuery = val;
            renderSearchPanel();
            renderContent();
        }

        // --- EXECUÇÃO DE ARRANQUE DO APLICATIVO ---
        window.onload = function() {
            loadBookmarks();
            setTheme('light'); // Define tema Dia (claro) como padrão inicial
            setChapter(-1);    // Define a página inicial como a Capa Escrita
        };
    </script>
</body>
</html>
